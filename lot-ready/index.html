<!DOCTYPE html>
<html lang="en">
<head>

<title>Lot Drawer</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&display=swap");
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#fff0d8;--ink:#080808;--muted:#716b63;--yellow:#f4cf3b;--line:#dfcdb1}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--ink);font-family:"Barlow Condensed";font-weight:400;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}
.app{width:100%;max-width:620px;margin:0 auto;padding:0 16px 28px}
.header{height:80px;margin:0 -16px;padding:0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center}

.brand-right{width:57px;height:32px}
.header button:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:6px}
.header-copy{padding-top:19px}

.card-back-logo{width:67%;height:auto;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 5px 5px rgba(0,0,0,.22));pointer-events:none}

.front-number{display:none}

.card:nth-child(2){z-index:4;transform:translate3d(-7px,7px,18px) rotate(1.7deg)}

.card.shuffle-a.shuffle-pass4{transform:translate3d(34px,-24px,76px) rotate(6deg)!important}.card.shuffle-b.shuffle-pass4{transform:translate3d(-38px,30px,70px) rotate(-7deg)!important}.card.shuffle-c.shuffle-pass4{transform:translate3d(22px,16px,62px) rotate(4deg)!important}.card.shuffle-d.shuffle-pass4{transform:translate3d(-26px,-20px,54px) rotate(-5deg)!important}.card.shuffle-e.shuffle-pass4{transform:translate3d(14px,-30px,46px) rotate(4deg)!important}

.card.winner{z-index:50!important;transition:transform 360ms cubic-bezier(.18,.86,.18,1),opacity 160ms ease}.card.winner.lift{transform:translate3d(0,-10px,150px) rotate(0deg) scale(1.045)!important}.card.winner.flipping{transform:translate3d(0,-8px,150px) rotate(0deg) scale(1.045)!important}.card.winner.flipping .card-inner,.card.winner.settled .card-inner{transform:rotateY(180deg)}.card.other-hidden{opacity:0!important;transform:translate3d(0,8px,-20px) scale(.92)!important;pointer-events:none}.card.winner.settled{transform:translate3d(0,0,80px) rotate(0deg) scale(1)!important}

.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(35,17,4,.42);backdrop-filter:blur(8px)}.modal.open{display:flex}.modal-box{width:min(550px,100%);max-height:90vh;overflow:auto;border:1.5px solid var(--ink);border-radius:16px;background:var(--bg);padding:20px;box-shadow:0 30px 100px rgba(0,0,0,.28)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}.modal-title{font-size:22px;font-weight:900;letter-spacing:-.035em}.close{width:44px;height:44px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-size:22px}.add-form{display:flex;gap:8px;margin-bottom:14px}.add-form input{min-width:0;flex:1;min-height:46px;border:1.5px solid var(--ink);border-radius:10px;background:rgba(255,255,255,.25);color:var(--ink);padding:11px 13px}.add-form .sample-button{min-width:118px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:600}.add-form button:not(.sample-button){min-width:72px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:600}.modal-count{margin-bottom:8px;color:#716b63;font-size:11px}.list{display:flex;flex-direction:column;gap:6px}.list-row{display:flex;align-items:center;gap:9px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.22);padding:7px 9px}.list-num{width:27px;color:#8a8177;font-size:11px;text-align:center}.list-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.remove{width:38px;height:38px;border:0;background:transparent;color:#716b63;font-size:20px}.empty{padding:28px;border:1px dashed #cdbb9e;border-radius:11px;color:#716b63;text-align:center;font-size:13px}.modal-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}.toast{position:fixed;z-index:200;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;pointer-events:none;border-radius:99px;background:var(--ink);color:#fff;padding:10px 16px;font-size:12px;font-weight:850;transition:opacity .22s ease,transform .22s ease}.toast.show{opacity:1;transform:translate(-50%,0)}

/* Design Atti typography: Barlow Condensed everywhere */
html, body, body *, body *::before, body *::after {
  font-family: "Barlow Condensed" !important;
}


/* Reference typography weights */
h1 { font-weight: 600 !important; }
.subtitle { font-weight: 400 !important; }
.tab,
.draw,
.manage,
.add-form button,
.reset,
.modal-title { font-weight: 600 !important; }
.front-label,
.front-text { font-family: "Barlow Condensed" !important; }


/* Header logo actions */
.brand-logo{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  margin:0;
  padding:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex:none;
}
.brand-logo img{
  pointer-events:none;
}
.brand-logo:focus-visible{
  outline:2px solid var(--ink);
  outline-offset:4px;
  border-radius:6px;
}
.brand-logo:active{
  transform:scale(.96);
}


.qr-modal{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(35,17,4,.48);
  backdrop-filter:blur(8px);
}
.qr-modal.open{display:flex}
.qr-box{
  width:min(360px,100%);
  border:1.5px solid var(--ink);
  border-radius:18px;
  background:var(--bg);
  padding:16px;
  box-shadow:0 30px 100px rgba(0,0,0,.28);
}
.qr-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}
.qr-title{
  font-size:22px;
  line-height:1;
  font-weight:600;
}
.qr-close{
  width:38px;
  height:38px;
  border:1.5px solid var(--ink);
  border-radius:10px;
  background:transparent;
  color:var(--ink);
  font-size:24px;
  line-height:1;
  font-weight:400;
}
.qr-image-wrap{
  width:100%;
  aspect-ratio:1;
  background:#fff;
  border-radius:10px;
  overflow:hidden;
}
.qr-image{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
}
.qr-caption{
  margin-top:10px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
  line-height:1.1;
  font-weight:400;
}


/* Interactive header logos */
.brand-logo{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  margin:0;
  padding:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex:none;
}
.brand-logo img{pointer-events:none}
.brand-logo:focus-visible{
  outline:2px solid var(--ink);
  outline-offset:4px;
  border-radius:6px;
}
.brand-logo:active,.brand-center:active{transform:scale(.96)}




.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.sound-toggle{
  flex:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-width:78px;
  height:32px;
  padding:0 9px;
  border:1.5px solid var(--ink);
  border-radius:8px;
  background:transparent;
  color:var(--ink);
  cursor:pointer;
  font-family:"Barlow Condensed"!important;
  font-size:12px;
  font-weight:600!important;
  letter-spacing:.08em;
}
.sound-toggle:active{transform:scale(.97)}
.sound-toggle:focus-visible{
  outline:2px solid var(--ink);
  outline-offset:3px;
}
.sound-icon{
  width:16px;
  height:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.sound-icon svg{width:16px;height:16px;display:block}
.sound-off{display:none}
.sound-toggle.is-muted .sound-on{display:none}
.sound-toggle.is-muted .sound-off{display:flex}
.sound-toggle.is-muted .sound-label::after{content:" OFF"}

</style>
</head>

<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <button class="brand-logo brand-left-button" id="qrButton" type="button" aria-label="Open QR code">
        <img class="brand-left" src="assets/header-1.png" alt="Design Atti">
      </button>
      <button class="brand-center" id="manageButton" type="button" aria-label="Open manage list">
        <img src="assets/header-2.png" alt="Peek Sneak">
      </button>
      <button class="brand-logo brand-right-button" id="resetButton" type="button" aria-label="Reset revealed card">
        <img class="brand-right" src="assets/header-3.png" alt="FDES">
      </button>
    </div>
  </header>

  <div class="header-copy">
    <div class="title-row">
      <h1>Draw the Lot</h1>
      <button class="sound-toggle" id="soundToggle" type="button" aria-label="Mute sound" aria-pressed="false">
        <span class="sound-icon sound-on" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 10v4h4l5 4V6l-5 4H4Z"/>
            <path d="M16 9.5c1.4 1.4 1.4 3.6 0 5"/>
            <path d="M18.5 7c2.8 2.8 2.8 7.2 0 10"/>
          </svg>
        </span>
        <span class="sound-icon sound-off" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 10v4h4l5 4V6l-5 4H4Z"/>
            <path d="m18 9-5 6"/>
            <path d="m13 9 5 6"/>
          </svg>
        </span>
        <span class="sound-label">SOUND</span>
      </button>
    </div>
    <p class="subtitle">Shuffle. Ideate. Create</p>
  </div>

  <section class="shell">
    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="Categories">
        <button class="tab active" type="button" data-category="1">SUBJECT</button>
        <button class="tab" type="button" data-category="2">PLOT</button>
        <button class="tab" type="button" data-category="3">?</button>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="stage-top">
        <span>Selected <strong id="categoryLabel">Subject</strong></span>
        <span id="status" aria-live="polite">Ready</span>
      </div>

      <div class="playground">
        <div class="deck" id="deck" aria-live="polite">
          <div class="card"><div class="card-inner"><div class="face back"><img class="card-back-logo" src="assets/card-logo.png" alt="FDES"></div><div class="face front"></div></div></div>
          <div class="card"><div class="card-inner"><div class="face back"><img class="card-back-logo" src="assets/card-logo.png" alt="FDES"></div><div class="face front"></div></div></div>
          <div class="card"><div class="card-inner"><div class="face back"><img class="card-back-logo" src="assets/card-logo.png" alt="FDES"></div><div class="face front"></div></div></div>
          <div class="card"><div class="card-inner"><div class="face back"><img class="card-back-logo" src="assets/card-logo.png" alt="FDES"></div><div class="face front"></div></div></div>
          <div class="card"><div class="card-inner"><div class="face back"><img class="card-back-logo" src="assets/card-logo.png" alt="FDES"></div><div class="face front"></div></div></div>
        </div>
      </div>

      <button class="draw" id="drawButton" type="button">DRAW</button>
    </div>
  </section>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Manage Subject</div>
      <button class="close" id="closeModal" type="button" aria-label="Close">×</button>
    </div>

    <form class="add-form" id="addForm">
      <input id="itemInput" maxlength="80" autocomplete="off" placeholder="Add a line item…">
      <button type="submit">ADD</button><button class="sample-button" id="sampleItems" type="button">SAMPLE ITEMS</button>
    </form>

    <div class="modal-count" id="modalCount">0 / 20 items</div>
    <div class="list" id="itemList"></div>

    <div class="modal-footer">
      <span style="font-size:11px;color:#666">Items can repeat on each draw</span>
      <span style="font-size:11px;color:#666">Maximum 20</span>
    </div>
  </div>
</div>


<div class="qr-modal" id="qrModal" role="dialog" aria-modal="true" aria-labelledby="qrModalTitle">
  <div class="qr-box">
    <div class="qr-head">
      <div class="qr-title" id="qrModalTitle">Scan to Join</div>

    `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:json&gid=1&range=${encodeURIComponent(GOOGLE_SHEET_RANGE)}`,
    `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:json&sheet=Page%202&range=${encodeURIComponent(GOOGLE_SHEET_RANGE)}`,
    `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:json&sheet=Sheet2&range=${encodeURIComponent(GOOGLE_SHEET_RANGE)}`
  ];

  const state = {
    category: "1",
    items: {1: [], 2: [], 3: []},
    busy: false,
    timers: []
  };

  // Keep the event operator's lots between reloads.
  try {
    const saved = JSON.parse(localStorage.getItem("peekSneakLotItems") || "null");
    if (saved && typeof saved === "object") {
      ["1","2","3"].forEach(k => {
        if (Array.isArray(saved[k])) state.items[k] = saved[k].slice(0, MAX_ITEMS);
      });
    }
  } catch {}

  function saveItems(){
    try { localStorage.setItem("peekSneakLotItems", JSON.stringify(state.items)); } catch {}
  }

  async function loadGoogleSheetItems(){
    for (const url of GOOGLE_SHEET_CANDIDATES){
      try {
        const response = await fetch(url, {cache: "no-store"});
        if (!response.ok) continue;
        const text = await response.text();
        const start = text.indexOf("{");
        const end = text.lastIndexOf("}");
        if (start < 0 || end <= start) continue;
        const data = JSON.parse(text.slice(start, end + 1));
        const rows = data?.table?.rows || [];
        const columns = [[], [], []];
        rows.forEach(row => {
          const cells = row.c || [];
          for (let i = 0; i < 3; i++){
            const value = cells[i]?.v ?? "";
            if (String(value).trim()) columns[i].push(String(value).trim());
          }
        });
        if (columns.some(list => list.length)){
          state.items = {
            1: columns[0].slice(0, MAX_ITEMS),
            2: columns[1].slice(0, MAX_ITEMS),
            3: columns[2].slice(0, MAX_ITEMS)
          };
          saveItems();
          return true;
        }
      } catch (error) {
        // Try the next sheet address; local fallback remains available.
      }
    }
    return false;
  }

  const $ = id => document.getElementById(id);
  const stage = $("stage");
  const deck = $("deck");
  const drawButton = $("drawButton");
  const status = $("status");
  const modal = $("modal");
  const itemInput = $("itemInput");

  const cards = Array.from(deck.querySelectorAll(".card"));

  function clearTimers(){
    state.timers.forEach(clearTimeout);
    state.timers = [];
  }

  function later(fn, ms){
    const id = setTimeout(fn, ms);
    state.timers.push(id);
    return id;
  }

  function remainingItems(){
    return state.items[state.category];
  }

  function resetVisualCards(){
    cards.forEach(card => {
      card.className = "card";
      card.style.opacity = "";
      card.style.transform = "";
      card.querySelector(".front").innerHTML = "";
      const inner = card.querySelector(".card-inner");
      inner.style.transform = "";
      inner.classList.remove("show-front");
    });
  }

  function render(){
    const cat = state.category;
    const items = state.items[cat];
    const remaining = remainingItems();

    document.querySelectorAll(".tab").forEach(tab => {
      tab.classList.toggle("active", tab.dataset.category === cat);
      tab.setAttribute("aria-selected", tab.dataset.category === cat ? "true" : "false");
    });

    const categoryNames = {1: "Subject", 2: "Plot", 3: "Twist"};
    $("categoryLabel").textContent = categoryNames[cat];
    $("modalTitle").textContent = "Manage " + categoryNames[cat];
    $("modalCount").textContent = `${items.length} / ${MAX_ITEMS} items`;

    $("itemList").innerHTML = "";

    if (!items.length){
      $("itemList").innerHTML = '<div class="empty">No line items yet.<br>Add them above.</div>';
    } else {
      items.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "list-row";

        const number = document.createElement("span");
        number.className = "list-num";
        number.textContent = String(index + 1).padStart(2, "0");

        const text = document.createElement("span");
        text.className = "list-text";
        text.textContent = item;
        text.title = item;

        const remove = document.createElement("button");
        remove.className = "remove";
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "Remove " + item);

        remove.addEventListener("click", () => {
          if (state.busy) return;
          const removed = state.items[cat].splice(index, 1)[0];
          saveItems();
          render();
        });

        row.append(number, text, remove);
        $("itemList").appendChild(row);
      });
    }

    if (state.busy){
      drawButton.disabled = true;
      drawButton.textContent = "DRAWING…";
    } else if (!items.length){
      drawButton.disabled = true;
      drawButton.textContent = "ADD ITEMS";
    } else {
      drawButton.disabled = false;
      drawButton.textContent = "DRAW";
    }
  }

  function setStatus(text){
    status.textContent = text;
    status.classList.remove("status-pulse");
    void status.offsetWidth;
    status.classList.add("status-pulse");
  }

  function openManager(){
    if (state.busy) return;
    render();
    modal.classList.add("open");
    itemInput.focus();
  }

  function closeManager(){
    modal.classList.remove("open");
  }

  // Lightweight Web Audio effects — no external audio files required.
  // Audio is created/resumed from the Draw button interaction, so mobile
  // browsers can play it without an autoplay permission prompt.
  let audioCtx = null;
  let soundMuted = false;

  function getAudioContext(){
    if (!audioCtx){
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return null;
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function shuffleSound(step = 0){
    if (soundMuted) return;
    const ctx = getAudioContext();
    if (!ctx) return;

    const now = ctx.currentTime;
    const duration = 0.075;
    const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * duration), ctx.sampleRate);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < data.length; i++){
      const envelope = Math.pow(1 - i / data.length, 2.2);
      data[i] = (Math.random() * 2 - 1) * envelope;
    }

    const source = ctx.createBufferSource();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();

    source.buffer = buffer;
    filter.type = "bandpass";
    filter.frequency.value = 1200 + (step % 4) * 260;
    filter.Q.value = 0.8;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.16, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    source.start(now);
    source.stop(now + duration);
  }

  function revealSound(){
    if (soundMuted) return;
    const ctx = getAudioContext();
    if (!ctx) return;

    const now = ctx.currentTime;
    const master = ctx.createGain();
    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(0.2, now + 0.018);
    master.gain.exponentialRampToValueAtTime(0.0001, now + 0.7);
    master.connect(ctx.destination);

    // Bright two-note reveal cue.
    [523.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const start = now + i * 0.095;
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(i === 0 ? 0.16 : 0.2, start + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.52);
      osc.connect(gain);
      gain.connect(master);
      osc.start(start);
      osc.stop(start + 0.55);
    });

    // Tiny low thump underneath the card reveal.
    const thump = ctx.createOscillator();
    const thumpGain = ctx.createGain();
    thump.type = "sine";
    thump.frequency.setValueAtTime(110, now);
    thump.frequency.exponentialRampToValueAtTime(55, now + 0.16);
    thumpGain.gain.setValueAtTime(0.0001, now);
    thumpGain.gain.exponentialRampToValueAtTime(0.11, now + 0.012);
    thumpGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
    thump.connect(thumpGain);
    thumpGain.connect(master);
    thump.start(now);
    thump.stop(now + 0.2);
  }


  function resetToReady(){
    clearTimers();
    state.busy = false;
    resetVisualCards();
    setStatus("Ready");
    render();
  }


  function resetToReady(){
    clearTimers();
    state.busy = false;
    resetVisualCards();
    setStatus("Ready");
    render();
  }

  function showToast(message){
    const toast = $("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.remove("show"), 1900);
  }

  function setWinnerFace(card, item){
    card.querySelector(".front").innerHTML = `
      <div class="front-content">
        <div class="front-label">YOU GOT</div>
        <div class="front-text"></div>
      </div>
    `;
    card.querySelector(".front-text").textContent = item;
  }

  function draw(){
    if (state.busy) return;

    const pool = remainingItems();

    if (!pool.length){
      showToast("Add more items in Manage list.");
      return;
    }

    clearTimers();
    resetVisualCards();

    state.busy = true;
    render();
    setStatus("Shuffling…");

    const selected = pool[Math.floor(Math.random() * pool.length)];
    const winnerIndex = Math.floor(Math.random() * cards.length);
    const winner = cards[winnerIndex];

    winner.classList.add("winner");
    setWinnerFace(winner, selected);

    /*
      Phase 1 — physical shuffle.
      Each card has only one transform owner: the .card itself.
      No animation and transition are competing on the same transform.
    */
    requestAnimationFrame(() => {
      const moves = ["shuffle-a","shuffle-b","shuffle-c","shuffle-d","shuffle-e"];
      cards.forEach((card,index) => card.classList.add(moves[index]));
      shuffleSound(0);
    });

    // Rapid, visible shuffle beats. Only one pass is active at a time so
    // every movement gets its own transition instead of being overwritten.
    const shufflePasses = [
      ["shuffle-pass", 120],
      ["shuffle-pass2", 240],
      ["shuffle-pass3", 360],
      ["shuffle-pass4", 480],
      ["shuffle-pass5", 600],
      ["shuffle-pass6", 720],
      ["shuffle-pass7", 840],
      ["shuffle-pass8", 960]
    ];

    let previousPass = null;
    shufflePasses.forEach(([pass, time]) => {
      later(() => {
        cards.forEach(card => {
          if (previousPass) card.classList.remove(previousPass);
          card.classList.add(pass);
        });
        previousPass = pass;
        shuffleSound(Math.round(time / 120));
      }, time);
    });

    // Return to the physical stack after the final beat.
    later(() => {
      cards.forEach(card => {
        card.classList.remove(
          "shuffle-a","shuffle-b","shuffle-c","shuffle-d","shuffle-e",
          "shuffle-pass","shuffle-pass2","shuffle-pass3","shuffle-pass4","shuffle-pass5",
          "shuffle-pass6","shuffle-pass7","shuffle-pass8"
        );
      });
      setStatus("Selecting…");
    }, 1100);

    /*
      Phase 2 — isolate the winner.
      Other cards disappear before the winning card turns edge-on.
      This eliminates the "cropped card behind the winner" problem.
    */
    later(() => {
      cards.forEach(card => {
        if (card !== winner) card.classList.add("other-hidden");
      });
      winner.classList.add("lift");
      setStatus("Revealing…");
    }, 1160);

    /*
      Phase 3 — one clean 180° flip.
      The card has separate back/front faces, so the yellow face cannot
      appear as a half-card or expose the back of another card.
    */
    later(() => {
      winner.classList.remove("lift");
      winner.classList.add("flipping");
      revealSound();
    }, 1310);

    later(() => {
      winner.classList.add("flipped","settled");
      winner.querySelector(".card-inner").style.transform = "rotateY(180deg)";
      winner.querySelector(".front-content").style.opacity = "1";
      winner.querySelector(".front-content").style.transform = "translateY(0) scale(1)";
      state.busy = false;
      setStatus("Revealed");
      render();

      // Keep only the winner visible until the next draw.
      cards.forEach(card => {
        if (card !== winner) card.classList.add("other-hidden");
      });
    }, 1310 + FLIP_MS + 40);
  }

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      if (state.busy) return;
      state.category = tab.dataset.category;
      clearTimers();
      resetVisualCards();
      setStatus("Ready");
      render();
    });
  });


  $("qrButton").addEventListener("click", () => {
    if (state.busy) return;
    $("qrModal").classList.add("open");
  });

  $("closeQrModal").addEventListener("click", () => {
    $("qrModal").classList.remove("open");
  });

  $("qrModal").addEventListener("click", event => {
    if (event.target === $("qrModal")) $("qrModal").classList.remove("open");
  });
  $("resetButton").addEventListener("click", () => {
    if (!state.busy) resetToReady();
  });


  $("soundToggle").addEventListener("click", () => {
    soundMuted = !soundMuted;
    const button = $("soundToggle");
    button.classList.toggle("is-muted", soundMuted);
    button.setAttribute("aria-pressed", String(soundMuted));
    button.setAttribute("aria-label", soundMuted ? "Turn sound on" : "Mute sound");
  });

  $("manageButton").addEventListener("click", openManager);
  $("closeModal").addEventListener("click", closeManager);

  modal.addEventListener("click", event => {
    if (event.target === modal) closeManager();
  });

  $("sampleItems").addEventListener("click", () => {
    if (state.busy) return;
    const samples = [
      "Socks","Coffee Mug","Keychain","Notebook","Sticker Pack",
      "Cap","Tote Bag","Phone Stand","Water Bottle","Desk Plant",
      "Pen","Bookmark","Postcard","Badge","Mini Puzzle"
    ];
    const existing = new Set(state.items[state.category]);
    const available = samples.filter(item => !existing.has(item));
    const slots = MAX_ITEMS - state.items[state.category].length;
    if (slots <= 0) {
      showToast("Maximum 20 items per category.");
      return;
    }
    const added = available.slice(0, slots);
    state.items[state.category].push(...added);
    saveItems();
    render();
    showToast(`${added.length} sample item${added.length === 1 ? "" : "s"} added.`);
  });

  $("addForm").addEventListener("submit", event => {
    event.preventDefault();

    if (state.items[state.category].length >= MAX_ITEMS){
      showToast("Maximum 20 items per category.");
      return;
    }

    const value = itemInput.value.trim();
    if (!value) return;

    state.items[state.category].push(value);
    saveItems();
    itemInput.value = "";
    render();
    itemInput.focus();
  });


  drawButton.addEventListener("click", draw);

  document.addEventListener("keydown", event => {
    if (event.key !== "Escape") return;
    if ($("qrModal").classList.contains("open")) {
      $("qrModal").classList.remove("open");
      return;
    }
    if (modal.classList.contains("open")) closeManager();
  });

  // Small starter data is intentionally not inserted.
  // The drawer starts empty so the event operator controls the actual lots.
  render();
  loadGoogleSheetItems().then(ok => {
    if (ok) {
      resetVisualCards();
      setStatus("Synced");
      render();
    }
  });
})();
</script>
</body>
</html>
